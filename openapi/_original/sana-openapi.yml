openapi: 3.1.0
info:
  title: Sana API
  version: v0/v1
  description: >-
    Sana's REST API for the Sana AI knowledge/learning platform. Programmatic access to
    users, groups, programs, assignments, courses, paths, teamspaces, reporting/Insights,
    and xAPI statements. Authentication is OAuth 2.0 client credentials returning a bearer
    token; GET requests require the `read` scope and write requests require the `write`
    scope. The API is served per tenant at https://<domain>.sana.ai.
