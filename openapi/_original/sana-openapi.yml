      description: >-
        Bearer access token obtained from POST /api/token via the OAuth 2.0
        client credentials grant.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{domain}.sana.ai/api/token
          scopes:
            read: Read access (required for GET requests)
            write: Write access (required for POST, PATCH, DELETE requests)
  parameters:
    next:
      name: next
      in: query
      required: false
      description: Cursor to fetch the next batch of results
      schema: { type: string }
    limit:
      name: limit
      in: query
      required: false
      description: Number of items to return (default 100, max 1000)
      schema: { type: integer, default: 100, maximum: 1000 }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    groupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    programId:
      name: programId
      in: path
      required: true
      schema: { type: string }
    courseId:
      name: courseId
      in: path
      required: true
      schema: { type: string }
    teamspaceId:
