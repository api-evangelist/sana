aid: sana
name: Sana
description: >-
  Sana is an enterprise AI platform, now part of Workday, offering two products: Sana, an
  AI knowledge and agent workspace that automates tasks, answers questions, and generates
  documents across a company's connected applications; and Sana Learn, an AI-native learning
  platform combining LMS, LXP, authoring, and virtual classroom capabilities. Sana exposes a
  secure REST API (users, groups, programs, assignments, courses, paths, teamspaces, reporting
  and Insights, and xAPI statements), served per tenant at https://<domain>.sana.ai and
  authenticated with OAuth 2.0 client credentials using read/write scopes. It also provides
  SCIM 2.0 user provisioning, SAML/OIDC single sign-on, and real-time xAPI webhook events.
  Sana is ISO 27001, SOC 2, and GDPR compliant and runs on Google Cloud. Originally surfaced
  as a portfolio company of NEA.
